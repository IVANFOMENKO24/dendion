<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dendi Online Multiplayer</title>
    <style>
        body {
            background: #222;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 512px;
            aspect-ratio: 256 / 240;
            background: black;
        }
        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            user-select: none;
        }
        .btn {
            background: #444;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            font-weight: bold;
            active-background: #666;
        }
        .dpad { display: grid; grid-template-areas: ". up ." "left . right" ". down ."; }
        .up { grid-area: up; }
        .down { grid-area: down; }
        .left { grid-area: left; }
        .right { grid-area: right; }
        
        .action-btns { display: flex; gap: 10px; justify-content: center; }
        .action-btn { background: #a00; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        #menu { padding: 10px; text-align: center; }
        input[type="file"] { display: none; }
        .load-btn { background: #0a0; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        
        #status { font-size: 12px; color: #888; margin-top: 5px; }
        
        #lobby {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .load-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .load-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="lobby">
        <div style="background: #333; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); text-align: center;">
            <h1 style="margin-top: 0;">🎮 NES Online</h1>
            
            <div id="lobby-main">
                <button class="load-btn" onclick="showCreateRoom()" style="width: 100%; margin-bottom: 10px;">Создать комнату</button>
                <button class="load-btn" onclick="showJoinRoom()" style="width: 100%; background: #007bff;">Войти по коду</button>
            </div>

            <div id="lobby-create" style="display: none;">
                <h3>Создание комнаты</h3>
                <label class="load-btn" style="display: block; margin-bottom: 10px;">
                    Выбрать игру (.nes)
                    <input type="file" id="rom-upload" accept=".nes">
                </label>
                <div id="room-code-display" style="font-size: 24px; font-weight: bold; color: #0a0; margin: 15px 0; display: none;">
                    Код: <span id="generated-code">----</span>
                </div>
                <button onclick="backToLobby()" style="background: #666; color: white; border: none; padding: 5px 10px; border-radius: 5px;">Назад</button>
            </div>

            <div id="lobby-join" style="display: none;">
                <h3>Вход в комнату</h3>
                <input type="text" id="join-code-input" placeholder="Введите код" style="padding: 10px; font-size: 18px; width: 80%; border-radius: 5px; border: none; margin-bottom: 10px;">
                <button class="load-btn" onclick="joinRoomByCode()" style="width: 100%;">Войти</button>
                <button onclick="backToLobby()" style="background: #666; color: white; border: none; padding: 5px 10px; border-radius: 5px; margin-top: 10px;">Назад</button>
            </div>
        </div>
    </div>

    <div id="game-ui" style="display: none;">
        <div id="menu">
            <div id="status">Ожидание...</div>
            <div style="margin-top: 5px; display: flex; gap: 5px; justify-content: center;">
                <button onclick="setPlayer(1)">Я Игрок 1</button>
                <button onclick="setPlayer(2)">Я Игрок 2</button>
                <button onclick="requestSync()" style="background: #f0ad4e; color: white; border: none; border-radius: 3px;">Синхрон 🔄</button>
                <button onclick="location.reload()" style="background: #d9534f; color: white; border: none; border-radius: 3px;">Сброс ❌</button>
            </div>
        </div>

        <div id="game-container">
            <canvas id="nes-canvas" width="256" height="240"></canvas>
        </div>

        <div id="debug-console" style="width: 100%; max-width: 512px; height: 60px; background: #000; color: #0f0; font-family: monospace; font-size: 10px; overflow-y: auto; padding: 5px; border: 1px solid #333; margin-top: 5px;">
            <div>[System] Консоль запущена...</div>
        </div>

        <div id="controls">
            <div class="dpad">
                <div class="btn up" data-key="0">↑</div>
                <div class="btn left" data-key="1">←</div>
                <div class="btn right" data-key="2">→</div>
                <div class="btn down" data-key="3">↓</div>
            </div>
            <div style="display: flex; flex-direction: column; justify-content: center; gap: 10px;">
                <div class="btn" data-key="4">SELECT</div>
                <div class="btn" data-key="5">START</div>
            </div>
            <div class="action-btns">
                <div class="btn action-btn" data-key="6">B</div>
                <div class="btn action-btn" data-key="7">A</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/jsnes/dist/jsnes.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
